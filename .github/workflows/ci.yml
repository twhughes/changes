# CI for the public repo: the Python suite, the browser view checks, and the static build.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: system libraries (python-rtmidi builds against ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: install
        run: pip install -e ".[dev]"
      - name: python tests (they also run every node view check)
        run: pytest -q
      - name: static site builds
        run: python tools/build_site.py --out /tmp/site
