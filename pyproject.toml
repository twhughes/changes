[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music"
version = "0.1.0"
description = "Modular music platform: theory kernel, MIDI substrate, chord trainer, song bundles"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "pyyaml>=6.0",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx"]
dsp = ["torch>=2.4", "matplotlib>=3.8"]

[project.scripts]
music-cockpit = "music.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["music"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]
